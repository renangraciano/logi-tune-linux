name: Feature request
description: Suggest a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the need, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?

  - type: input
    id: options-plus
    attributes:
      label: Does Logi Options+ do this?
      description: If so, saying how it behaves there helps us match it.
