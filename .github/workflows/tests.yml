name: tests

on:
  push:
    branches: [main, master]
  pull_request:

# Estes fluxos só leem o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # O gettext deixa a suíte conferir que os catálogos de tradução
      # acompanham o código, em vez de só existirem.
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # A suíte usa um transporte HID++ falso, então roda sem hardware
      # e sem acesso a /dev/hidraw.
      - name: Run tests
        run: python -m pytest -q

      # A suíte não abre a janela, então um nome indefinido num caminho da
      # interface passava despercebido até alguém rodar o aplicativo.
      - name: Check for undefined names
        run: python -m pyflakes logitune/
