[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logi-tune-linux"
dynamic = ["version"]
description = "Configure Logitech MX Master mice on Linux — an open alternative to Logi Options+"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Renan Graciano de Souza" }]
keywords = ["logitech", "hidpp", "mx-master", "mouse", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

# A stack HID++ fala direto com /dev/hidraw e não depende de nada externo.
# A interface gráfica usa PyGObject, que no Ubuntu vem do pacote do sistema
# (python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1) e por isso não é listada aqui.
dependencies = []

[project.optional-dependencies]
# O evdev é opcional em produção (só a síntese de teclas o usa), mas os
# testes que leem atalhos precisam dele — sem isto o CI os pula em silêncio.
dev = ["pytest>=7", "evdev>=1.6"]

[project.scripts]
logitune = "logitune.cli:main"
logitune-daemon = "logitune.daemon.service:main"

[project.gui-scripts]
logitune-gui = "logitune.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "logitune.__version__" }

[tool.setuptools.packages.find]
include = ["logitune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
