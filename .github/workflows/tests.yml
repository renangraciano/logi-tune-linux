name: tests

on:
  push:
    branches: [main, master]
  pull_request:

# Estes fluxos só leem o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # A suíte usa um transporte HID++ falso, então roda sem hardware
      # e sem acesso a /dev/hidraw.
      - name: Run tests
        run: python -m pytest -q
