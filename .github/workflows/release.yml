name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A comparação é entre versões, não entre strings: uma tag legível como
      # v0.2.0-rc.1 e o __version__ canônico 0.2.0rc1 são a mesma versão para
      # o Python, e exigir que batam letra por letra obrigaria a escrever uma
      # das duas de forma errada.
      - name: Check that the tag matches the package version
        id: version
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, pathlib, re, sys
          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pkg = re.search(
              r'__version__ = "([^"]+)"',
              pathlib.Path("logitune/__init__.py").read_text(),
          ).group(1)
          try:
              if Version(tag) != Version(pkg):
                  sys.exit(f"Tag {tag} is not version {pkg}")
          except InvalidVersion as exc:
              sys.exit(f"cannot read a version: {exc}")
          print(f"tag {tag} == __version__ {pkg}")

          # Quem decide se é pré-release é o parser de versão, não uma busca
          # por letra no nome da tag: "beta" contém um "b", mas "v1.0.0"
          # também contém um "0" e a heurística por substring erra cedo.
          saida = os.environ["GITHUB_OUTPUT"]
          with open(saida, "a", encoding="utf-8") as f:
              f.write(f"prerelease={str(Version(tag).is_prerelease).lower()}\n")
          PY

      # O setup.py compila os catálogos durante o build e apenas avisa se o
      # msgfmt faltar. Numa release isso sairia como um pacote sem tradução
      # e ninguém notaria, então aqui o gettext é obrigatório.
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # O .deb sai do mesmo wheel, então carrega os mesmos catálogos. Ele é
      # construído antes da verificação abaixo para que, se algo faltar, o
      # erro apareça uma vez só.
      - name: Build the Debian package
        run: |
          python -m pip install --quiet packaging
          scripts/build-deb.sh dist

      - name: Check the built wheel carries the translations
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          catalogos = [n for n in zipfile.ZipFile(wheel).namelist()
                       if n.endswith(".mo")]
          if not catalogos:
              sys.exit(f"{wheel} has no compiled translations")
          print("\n".join(catalogos))
          PY

      # O .deb é montado à mão a partir do wheel, então nada garante sozinho
      # que cada peça entrou. Um pacote sem a regra udev instala e não dá
      # acesso ao mouse; sem a unidade, nada aplica perfis.
      - name: Check the Debian package is complete
        run: |
          python - <<'PY'
          import glob, subprocess, sys

          deb = sorted(glob.glob("dist/*.deb"))[-1]
          conteudo = subprocess.run(
              ["dpkg-deb", "-c", deb], capture_output=True, text=True, check=True
          ).stdout
          exigidos = [
              "/usr/bin/logitune",
              "/usr/bin/logitune-daemon",
              "/usr/bin/logitune-gui",
              "/usr/lib/udev/rules.d/70-logitune.rules",
              "/usr/lib/systemd/user/logitune-daemon.service",
              "/usr/share/applications/",
              "/usr/share/icons/hicolor/scalable/apps/",
              "/usr/share/doc/logi-tune-linux/copyright",
              "/LC_MESSAGES/logi-tune-linux.mo",
          ]
          faltando = [c for c in exigidos if c not in conteudo]
          if faltando:
              sys.exit(f"{deb} is missing: {faltando}")

          unidade = subprocess.run(
              ["dpkg-deb", "--fsys-tarfile", deb],
              capture_output=True, check=True,
          ).stdout
          import io, tarfile
          with tarfile.open(fileobj=io.BytesIO(unidade)) as tar:
              texto = tar.extractfile(
                  "./usr/lib/systemd/user/logitune-daemon.service"
              ).read().decode()
          if "ExecStart=/usr/bin/logitune-daemon" not in texto:
              sys.exit("the unit still points at the pipx path")
          print(f"{deb}: complete")
          PY

      # Uma pré-release não tem seção própria no changelog: ela descreve a
      # versão que está sendo preparada. Sem esta busca pela versão base, uma
      # tag rc publicaria apenas "See CHANGELOG.md.".
      - name: Extract release notes for this version
        run: |
          python -m pip install --quiet packaging
          python - <<'PY' > RELEASE_NOTES.md
          import os, pathlib, re
          from packaging.version import Version

          pedida = Version(os.environ["GITHUB_REF_NAME"].lstrip("v"))
          texto = pathlib.Path("CHANGELOG.md").read_text()

          def secao(rotulo: str) -> str | None:
              achado = re.search(
                  rf"^## \[{re.escape(rotulo)}\].*?$(.*?)(?=^## \[|\Z)",
                  texto, re.M | re.S)
              return achado.group(1).strip() if achado else None

          base = ".".join(str(n) for n in pedida.release)
          corpo = secao(str(pedida)) or secao(base)

          if corpo and pedida.is_prerelease:
              corpo = (
                  f"Pre-release for {base}. The notes below are that version's.\n\n"
                  + corpo
              )
          print(corpo or "See CHANGELOG.md.")
          PY

      # Pinada por SHA: esta action roda com contents:write, e uma tag móvel
      # pode ser reapontada para outro código. Corresponde à v2.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
