<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620">
<!--
  SPDX-License-Identifier: GPL-3.0-or-later

  Esquema do MX Master 4 em vista superior, desenhado para este projeto.

  É um desenho e não uma foto por dois motivos. O render oficial da Logitech é
  material de marca, que não pode ser redistribuído sob GPL. E uma foto em
  perspectiva esconde justamente os botões do polegar, que são os mais
  interessantes de configurar — de cima, todos aparecem, e o hotspot pode ser
  posicionado sobre o botão em vez de sobre um chute.

  As regiões têm id para que as coordenadas em mouse_view.py possam ser
  conferidas contra o desenho.
-->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f66"/>
      <stop offset="1" stop-color="#3c4046"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33363b"/>
      <stop offset="1" stop-color="#4a4e55"/>
    </linearGradient>
  </defs>

  <!-- Apoio do polegar, que se projeta à esquerda do corpo -->
  <path id="thumb-wing" fill="url(#wing)" stroke="#22252a" stroke-width="3"
        d="M158 246
           C118 238 70 254 50 302
           C28 356 26 442 52 490
           C76 534 128 546 158 530 Z"/>

  <!-- Corpo principal -->
  <path id="shell" fill="url(#shell)" stroke="#22252a" stroke-width="3"
        d="M262 44
           C214 44 178 78 168 132
           C156 196 150 300 152 388
           C154 470 168 542 214 566
           C258 588 322 574 348 528
           C374 482 380 380 374 288
           C368 190 350 108 318 70
           C302 52 284 44 262 44 Z"/>

  <!-- Divisão entre os botões da frente -->
  <path d="M262 46 C258 130 258 190 259 236" stroke="#22252a" stroke-width="3" fill="none"/>
  <!-- Linha que separa a frente do corpo -->
  <path d="M170 236 C230 250 300 250 372 236" stroke="#22252a" stroke-width="3" fill="none"/>

  <!-- Botão esquerdo (0x0050) -->
  <path id="left-click" fill="#4e535a" stroke="#22252a" stroke-width="2"
        d="M262 48 C216 48 182 82 172 134 C165 172 162 206 170 234
           C200 246 232 250 259 250 C259 190 258 128 262 48 Z"/>
  <!-- Botão direito (0x0051) -->
  <path id="right-click" fill="#4e535a" stroke="#22252a" stroke-width="2"
        d="M264 48 C286 48 302 56 316 72 C346 110 362 188 368 234
           C330 246 292 250 262 250 C261 190 261 128 264 48 Z"/>

  <!-- Roda principal e clique do meio (0x0052) -->
  <rect id="wheel" x="246" y="86" width="32" height="120" rx="16"
        fill="#2a2d32" stroke="#1b1e22" stroke-width="2"/>
  <g stroke="#565b63" stroke-width="2" stroke-linecap="round">
    <path d="M252 104h20"/><path d="M252 122h20"/><path d="M252 140h20"/>
    <path d="M252 158h20"/><path d="M252 176h20"/>
  </g>

  <!-- SmartShift, atrás da roda (0x00C4) -->
  <rect id="smartshift" x="248" y="276" width="30" height="44" rx="14"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>

  <!-- Roda do polegar, na lateral do corpo -->
  <rect id="thumb-wheel" x="148" y="286" width="22" height="86" rx="10"
        fill="#2a2d32" stroke="#1b1e22" stroke-width="2"/>
  <g stroke="#565b63" stroke-width="2" stroke-linecap="round">
    <path d="M153 302h12"/><path d="M153 318h12"/>
    <path d="M153 334h12"/><path d="M153 350h12"/>
  </g>

  <!-- Voltar (0x0053) e Avançar (0x0056), à frente do polegar -->
  <rect id="back" x="100" y="292" width="36" height="42" rx="13"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>
  <rect id="forward" x="100" y="344" width="36" height="42" rx="13"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>

  <!-- Botão de gestos, sob o apoio do polegar (0x00C3) -->
  <ellipse id="gesture" cx="106" cy="424" rx="32" ry="20"
           fill="#3a3e44" stroke="#22252a" stroke-width="2"/>

  <!-- Actions Ring: o painel hexagonal do MX Master 4 (0x01A0) -->
  <g id="actions-ring">
    <path d="M78 466 L112 456 L140 478 L134 514 L100 526 L70 504 Z"
          fill="#2f3339" stroke="#5ee3c2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86 486 C96 476 112 478 118 490" fill="none" stroke="#565b63" stroke-width="2"/>
    <path d="M82 500 C96 484 118 488 126 506" fill="none" stroke="#565b63" stroke-width="2"/>
  </g>

  <!-- LED de status -->
  <circle cx="330" cy="300" r="6" fill="#5ee3c2"/>
</svg>
