name: commit-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Estes fluxos só leem o repositório.
permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squashed commit message, so it is the one
      # that has to follow Conventional Commits.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
          if ! printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits: $TITLE"
            echo "Expected something like: feat(hidpp): decode the haptic feature"
            echo "Types: feat fix docs refactor perf test build ci chore revert"
            exit 1
          fi
          echo "OK: $TITLE"
