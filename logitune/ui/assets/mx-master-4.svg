<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<!--
  SPDX-License-Identifier: GPL-3.0-or-later

  Esquema do MX Master 4 visto pelo lado do polegar, desenhado para este
  projeto.

  É um desenho e não uma foto porque o render oficial da Logitech é material
  de marca, que não pode ser redistribuído sob GPL.

  É de perfil, e não de cima, porque de cima os botões do polegar não
  aparecem: Voltar, Avançar, a roda do polegar e o botão de gestos ficam na
  face lateral. A primeira versão era uma vista superior e achatava esses
  botões para o topo em posições inventadas — o de gestos acabava logo atrás
  do Voltar/Avançar, onde ele não fica.

  A roda de rolagem e o SmartShift ficam na face de cima, e de perfil
  aparecem na borda superior, que é onde estão desenhados.

  As regiões têm id para que as coordenadas em mouse_model.py possam ser
  conferidas contra o desenho.
-->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f66"/>
      <stop offset="1" stop-color="#3c4046"/>
    </linearGradient>
    <linearGradient id="thumb-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e55"/>
      <stop offset="1" stop-color="#34383e"/>
    </linearGradient>
  </defs>

  <!-- Corpo visto pelo lado esquerdo: baixo à frente, corcova atrás -->
  <path d="M46 236
           C54 176 104 138 178 118
           C244 100 322 92 376 104
           C434 117 474 158 482 214
           C489 264 468 302 414 312
           L122 312
           C72 308 42 278 46 236 Z"
        fill="url(#shell)" stroke="#23262b" stroke-width="3"/>

  <!-- Divisão entre a face de cima e a lateral -->
  <path d="M60 214 C140 176 300 158 470 190"
        fill="none" stroke="#2b2e34" stroke-width="2" opacity="0.7"/>

  <!-- Roda de rolagem (0x0052), na face de cima, vista pela borda -->
  <rect id="wheel" x="152" y="98" width="46" height="40" rx="20"
        fill="#2a2d32" stroke="#1b1e22" stroke-width="2"/>
  <g stroke="#565b63" stroke-width="2" stroke-linecap="round">
    <path d="M160 110h30"/><path d="M160 122h30"/><path d="M160 134h30"/>
  </g>

  <!-- SmartShift (0x00C4), atrás da roda, também na face de cima -->
  <rect id="smartshift" x="250" y="104" width="46" height="28" rx="13"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>

  <!-- Avançar (0x0056) e Voltar (0x0053), na lateral, à frente da roda do
       polegar. O da frente é o Avançar. -->
  <rect id="forward" x="70" y="165" width="52" height="38" rx="14"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>
  <rect id="back" x="130" y="165" width="52" height="38" rx="14"
        fill="#3a3e44" stroke="#22252a" stroke-width="2"/>

  <!-- Roda do polegar, no canal da lateral -->
  <rect id="thumb-wheel" x="196" y="160" width="96" height="30" rx="14"
        fill="#2a2d32" stroke="#1b1e22" stroke-width="2"/>
  <g stroke="#565b63" stroke-width="2" stroke-linecap="round">
    <path d="M212 168v14"/><path d="M228 168v14"/>
    <path d="M244 168v14"/><path d="M260 168v14"/><path d="M276 168v14"/>
  </g>

  <!-- Botão de gestos (0x00C3): o apoio do polegar inteiro -->
  <ellipse id="gesture" cx="150" cy="248" rx="88" ry="45"
           fill="url(#thumb-pad)" stroke="#22252a" stroke-width="2"/>
  <g fill="none" stroke="#4f545c" stroke-width="2" stroke-linecap="round"
     opacity="0.8">
    <path d="M108 240 C130 226 172 226 192 240"/>
    <path d="M104 258 C130 240 174 240 196 258"/>
  </g>

  <!-- Actions Ring (0x01A0): o painel háptico atrás do apoio -->
  <g id="actions-ring">
    <path d="M300 214 L338 206 L368 230 L360 268 L322 278 L292 252 Z"
          fill="#2f3339" stroke="#5ee3c2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M308 240 C318 230 336 232 344 244" fill="none"
          stroke="#565b63" stroke-width="2"/>
    <path d="M304 254 C318 238 342 242 352 260" fill="none"
          stroke="#565b63" stroke-width="2"/>
  </g>

  <!-- Luz de estado -->
  <circle cx="440" cy="232" r="6" fill="#5ee3c2"/>
</svg>
