name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('logitune/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match __version__ $PKG" >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Extract release notes for this version
        run: |
          python - <<'PY' > RELEASE_NOTES.md
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              text, re.M | re.S)
          print((match.group(1).strip() if match else "See CHANGELOG.md."))
          PY

      # Pinada por SHA: esta action roda com contents:write, e uma tag móvel
      # pode ser reapontada para outro código. Corresponde à v2.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
